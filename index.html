<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro Game</title>
<style>
  :root { --bg:#0b1230; --paper:#f6efdc; --ink:#1a1a1a; --dim:#5b5a55; --blue:#2f8fe8; --red:#e9475a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 "Comic Sans MS","Chalkboard SE","Comic Neue",cursive,sans-serif;
         display:flex; flex-wrap:wrap; gap:22px; justify-content:center; align-items:flex-start; padding:20px; }
  #bgc { position:fixed; inset:0; width:100vw; height:100vh; z-index:-1; }
  canvas#c { width:100%; aspect-ratio:1/1; border-radius:14px; touch-action:none; cursor:grab;
             border:4px solid #111; box-shadow:5px 6px 0 #0007; background:#0d1544; }
  canvas#c.dragging { cursor:grabbing; }
  #side { display:flex; flex-direction:column; gap:14px; width:310px; max-width:92vw; }
  #panel, #setup { background:var(--paper); border:4px solid #111; border-radius:14px; padding:16px 18px; width:100%;
           box-shadow:5px 6px 0 #0007; }
  #ctrl { border-collapse:collapse; margin-bottom:6px; } #ctrl th { font-weight:400; font-size:13px; color:var(--dim); padding:0 8px; } #ctrl td { padding:2px 8px; text-align:center; } #ctrl td:first-child { text-align:left; font-weight:700; -webkit-text-stroke:.6px #111; paint-order:stroke fill; }
  input.ck { appearance:none; -webkit-appearance:none; width:24px; height:24px; margin:0; border:3px solid #111; border-radius:6px; background:#fff; cursor:pointer; vertical-align:middle; display:inline-grid; place-items:center; }
  input.ck:checked { background:var(--c); box-shadow:inset 0 0 0 3px #fff; }
  .rect { display:inline-block; width:36px; height:20px; border:3px solid #111; border-radius:5px; background:var(--c); vertical-align:middle; }
  #starts { margin:4px 0; } #starts .sw { display:inline-block; margin:0 0 0 6px; cursor:pointer; } #starts input { position:absolute; opacity:0; pointer-events:none; }
  #starts .rect { opacity:.35; } #starts input:checked + .rect { opacity:1; box-shadow:0 0 0 3px #fff, 0 0 0 5px #111; } #starts input:disabled + .rect { cursor:default; }
  #setup label { display:block; margin:2px 0; } #setup select { font:inherit; }
  #toprow { display:flex; gap:10px; align-self:flex-start; } #toprow button { margin:0; }
  h1 { margin:0 0 8px; font-size:26px; letter-spacing:1px; color:#e8590c; -webkit-text-stroke:1.5px #111; paint-order:stroke fill; text-shadow:2px 2px 0 #111; }
  #turn { font-weight:700; font-size:19px; margin-bottom:6px; -webkit-text-stroke:.6px #111; paint-order:stroke fill; }
  #msg { min-height:44px; color:var(--dim); }
  #gauge { margin:0 0 12px; }
  #gauge .glabel { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; margin-bottom:3px; }
  #gauge .glabel b:first-child { color:var(--blue); } #gauge .glabel b:last-child { color:var(--red); }
  #gauge .glabel b { -webkit-text-stroke:.6px #111; paint-order:stroke fill; }
  #gauge .glabel span { font-size:13px; color:var(--dim); }
  #gauge .gbar { position:relative; height:22px; border:3px solid #111; border-radius:11px; background:var(--red); overflow:hidden; }
  #gauge #gblue { height:100%; width:50%; background:var(--blue); transition:width .5s; }
  #aiinfo { white-space:pre-line; margin-top:10px; padding:6px 10px; min-height:4.8em; background:#fffbea; border:2px solid #111; border-radius:8px; font:12px/1.4 Consolas,monospace; color:var(--dim); }
  button { background:#ffd24d; color:var(--ink); border:3px solid #111; border-radius:10px; padding:6px 12px; font:inherit; font-weight:700;
           cursor:pointer; margin:8px 4px 0 0; box-shadow:2px 3px 0 #111; }
  #onlineinfo { display:none; margin-top:10px; background:#fff8e6; border:3px solid #111; border-radius:10px; padding:8px 10px; font-size:14px; }
  #onlineinfo input { width:100%; margin:6px 0 2px; font:inherit; font-size:13px; padding:3px 6px; border:2px solid #111; border-radius:6px; }
  button:hover { background:#ffe27f; } button:active { transform:translate(2px,3px); box-shadow:none; }
  #main { display:flex; flex-direction:column; gap:22px; flex:1 1 520px; min-width:0;       /* shrinks to leave room for the panel on the right */
          max-width:min(1100px, calc((100vh - 48px) * var(--ar, 1.17))); }   /* the whole playfield stays visible */
</style>
</head>
<body>
<canvas id="bgc"></canvas>
<div id="main">
<canvas id="c" width="900" height="900"></canvas>

</div>
<div id="side">
  <div id="toprow"><button id="tutorial">Tutorial</button><button id="theme">Theme: Space</button></div>
  <div id="setup">
    <table id="ctrl"><tr><th></th><th id="thH">Human</th><th id="thA">AI</th></tr>
      <tr><td><span class="rect" style="--c:var(--blue)" title="Blue"></span></td><td><input type="checkbox" class="ck" id="ck0h" style="--c:var(--blue)"></td><td><input type="checkbox" class="ck" id="ck0a" style="--c:var(--blue)" checked></td></tr>
      <tr><td><span class="rect" style="--c:var(--red)" title="Red"></span></td><td><input type="checkbox" class="ck" id="ck1h" style="--c:var(--red)" checked></td><td><input type="checkbox" class="ck" id="ck1a" style="--c:var(--red)"></td></tr></table>
    <div id="starts">Starts <label class="sw" title="Blue starts"><input type="radio" name="start" value="0" checked><span class="rect" style="--c:var(--blue)"></span></label><label class="sw" title="Red starts"><input type="radio" name="start" value="1"><span class="rect" style="--c:var(--red)"></span></label></div>
    <label>Astronauts <select id="nAstro"><option>2</option><option selected>4</option></select></label>
    <label><input type="checkbox" id="cRover" checked> Rover</label>
    <label><input type="checkbox" id="cDrone" checked> Drone</label>
    <label><input type="checkbox" id="cShield" checked> Shield</label>
    <button id="reset">New game</button>
    <button id="online" title="Online game: tick Human on the colour you want to play (Host); your friend gets the other one. The piece setup and the starting colour are sent along.">Online game</button>
    <div id="onlineinfo"></div>
  </div>
<div id="panel">
  <div id="turn" hidden></div><div id="msg" hidden></div>   <!-- not shown any more, but the code still writes its status texts here -->
  <div id="gauge" title="The computer's estimate of the current position (static evaluation): the blue part grows when Blue is ahead, the red part when Red is ahead.">
    <div class="glabel"><b>Blue</b><span id="gval">even</span><b>Red</b></div>
    <div class="gbar"><div id="gblue"></div></div>
  </div>
  <label>&nbsp; look-ahead
    <select id="depth"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option></select>
    double moves</label><br>
  <label><input type="checkbox" id="showRanges" checked> Display ranges</label><br>
  <button id="undo">Undo move</button>
  <button id="suggest">Suggest move</button>
  <button id="endgame">End game</button>
  <div id="aiinfo">AI search: no move computed yet.</div>
</div>
</div>

<script id="engine">
// Game engine: rules, move generation and AI search. No DOM access, so it also runs inside the worker.
let ROVER_DOUBLE = true;                       // a rover that has never moved may step two hexes along a line (like a pawn); set false for the old rule
const COLS = 9, ROWS = 9, CELL = 100, MAXFUEL = 3, START_FUEL = 1, VEH_FUEL = 1, ROVER_FUEL = 2;   // a drone carries 1 unit, a rover 2 (one per laser shot)
// The board is a rectangle of COLS x ROWS pointy-top hexes (77 cells: the shifted odd rows lose their last hex, which would stick out on the right); every odd row is shifted right by half a hex. Positions are stored
// in axial coordinates (x = q + AXS, y = row) so that all six directions are the same constant steps everywhere:
// x = column - floor(row / 2) + AXS. AXS keeps x >= 0 (needed for the lookup tables).
const AXS = (ROWS - 1) >> 1, XN = COLS + AXS;
const toX = (col, row) => col - (row >> 1) + AXS, colOf = (x, y) => x - AXS + (y >> 1);
const MIDC = (COLS - 1) / 2;   // rovers and drones carry one unit, which they can pass to a neighbouring astronaut
const HOME = [ROWS - 1, 0];                    // owner 0 = Blue (bottom row), owner 1 = Red (top row)
const NAME = ['Blue', 'Red', 'Nobody'], COLOR = ['#2f8fe8', '#e9475a', '#6b6b6b'];
const DRAW = 2;                                // value of `winner` when the game is drawn
const KCOL = { walk:'#3ddc84', jump:'#35d0ff', capture:'#ff4d5e', push:'#ffa733', resign:'#ff7a33', refuel:'#ffe14d', feed:'#ff9de2', cover:'#9fe3ff' };
const STATION = { x: toX(MIDC, MIDC), y: MIDC };   // the sun sits in the middle of the board
const CORE = [{ x: toX(MIDC, ROWS - 1), y: ROWS - 1 }, { x: toX(MIDC, 0), y: 0 }];   // Blue's and Red's Core
const fixed = t => t.type === 'core' || t.type === 'shield';   // cannot be captured, pushed or landed on
// Hex directions in axial coordinates (pointy-top hexes).
const HEX6 = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];   // neighbours: E, NE, NW, W, SW, SE (screen angle = -60 deg * index)
const fuelCap = p => p.type === 'astro' ? MAXFUEL : p.type === 'rover' ? ROVER_FUEL : VEH_FUEL;   // largest tank of a piece
const hexDist = (ax, ay, bx, by) => (Math.abs(ax - bx) + Math.abs(ay - by) + Math.abs(ax + ay - bx - by)) / 2;

// A shield sits on top of a hex: at() returns it instead of whatever stands under it, so everything under a shield is invisible
// to captures, pushes and laser hits (fully protected), and covered() pieces get no moves of their own.
const at = (x, y) => { let r; for (const p of pieces) if (p.x === x && p.y === y && p.type !== 'fire') { if (p.type === 'shield') return p; r = r || p; } return r; };   // fuel fires are floor tokens: they never count as a piece here
const covered = p => p.type !== 'shield' && pieces.some(q => q.type === 'shield' && q.x === p.x && q.y === p.y);
// an own shield with nothing under it can be entered by the owner's other pieces (they then stand under it)
const freeShield = (t, o) => !!t && t.type === 'shield' && t.owner === o && !pieces.some(q => q !== t && q.x === t.x && q.y === t.y && q.type !== 'fire');
const inB = (x, y) => y >= 0 && y < ROWS && colOf(x, y) >= ((y === 0 || y === ROWS - 1) ? 1 : 0) && colOf(x, y) < COLS - (y & 1) - ((y === 0 || y === ROWS - 1) ? 1 : 0);   // the four corner hexes are cut off   // the shifted (odd) rows are one hex shorter, so the right edge is almost straight
const isStation = (x, y) => x === STATION.x && y === STATION.y;
const nearStation = p => hexDist(p.x, p.y, STATION.x, STATION.y) === 1;
// How far a jetpack has to fly: the sun cannot be crossed, even in the air. Two hexes on a straight line with the sun strictly between
// them (the only case where every shortest route leads over the sun) are one step further apart, so the far side of the sun is 3 away, not 2.
function flyDist(ax, ay, bx, by) {
  const d = hexDist(ax, ay, bx, by), dx = bx - ax, dy = by - ay;
  if (d < 2 || !(dx === 0 || dy === 0 || dx + dy === 0)) return d;      // not on one of the three straight axes: another shortest route exists
  const ux = dx / d, uy = dy / d, sx = STATION.x - ax, sy = STATION.y - ay;
  const t = ux !== 0 ? sx / ux : sy / uy;
  return t > 0 && t < d && sx === t * ux && sy === t * uy ? d + 1 : d;
}

function beamTrace(p, dx, dy) {                    // where a laser shot from rover p stops, and what it destroys
  let x = p.x, y = p.y;
  for (;;) {
    x += dx; y += dy;
    const stop = { ex: x - dx * .5, ey: y - dy * .5, victim: null };   // beam end in axial coordinates: the edge of the blocker
    if (!inB(x, y) || isStation(x, y)) return stop;
    const t = at(x, y);
    if (!t) continue;
    if (t.type === 'drone' || t.type === 'astro' || t.type === 'rover') return { ex: x, ey: y, victim: t };
    if (t.type === 'shield') return { ...stop, shield: t };   // a shield stops the beam and is damaged by it
    return stop;                                     // a Core
  }
}

function legal(p) {
  const out = [], o = p.owner;
  if (p.st > 0 || covered(p)) return out;            // stunned by a drone push, or frozen under a shield (the shield has to move first)
  const A = (x, y) => at(x, y);
  const push = (x, y, kind, extra) => out.push({ x, y, kind, ...extra });
  if ((p.type === 'rover' || p.type === 'drone') && p.fuel < fuelCap(p) && nearStation(p)) push(STATION.x, STATION.y, 'refuel');   // vehicles refuel at the sun too (drag them onto the sun; they stay put)
  if (p.type === 'core') {                                             // a Core sidesteps one hex along its row (onto an empty hex only), or flies into the central fire = resigns
    const pinned = pieces.some(q => q.type === 'astro' && q.owner !== o && !covered(q) && hexDist(q.x, q.y, p.x, p.y) === 1);   // an enemy astronaut beside the Core: it cannot sidestep any more
    if (!pinned) for (const dx of [-1, 1]) if (inB(p.x + dx, p.y) && !A(p.x + dx, p.y)) push(p.x + dx, p.y, 'walk');
    push(STATION.x, STATION.y, 'resign');
  } else if (p.type === 'shield') {                                           // one step to any neighbour, also onto occupied hexes (it then covers whatever stands there)
    for (const [dx, dy] of HEX6) {
      const x = p.x + dx, y = p.y + dy;
      if (!inB(x, y) || isStation(x, y)) continue;
      const t = A(x, y);
      if (t && (t.type === 'shield' || t.type === 'core')) continue;   // never onto another shield or a Core
      push(x, y, t ? 'cover' : 'walk');
    }
  } else if (p.type === 'astro') {
    const reach = p.fuel + 1;                                          // fuel = range: 0 fuel reaches the 6 neighbours, each fuel unit adds one step
    for (let dy = -reach; dy <= reach; dy++) for (let dx = -reach; dx <= reach; dx++) {
      if (hexDist(0, 0, dx, dy) > reach) continue;
      const x = p.x + dx, y = p.y + dy;
      const d = flyDist(p.x, p.y, x, y);                               // the sun is in the way: no flying across it
      if (d < 1 || d > reach) continue;
      if (!inB(x, y) || isStation(x, y)) continue;
      const t = A(x, y);
      const fs = freeShield(t, o);                                     // an own shield with nothing under it: the astronaut may move under it
      if (t && !fs && (t.owner === o || t.type === 'shield')) continue;   // own piece, or an enemy shield (cannot be captured)
      if (d === 1) push(x, y, t && !fs ? 'capture' : 'walk');          // a neighbouring hex: free (an enemy there is captured, a Core there wins)
      else if (!t || fs || !fixed(t)) push(x, y, 'jump', { cost: d - 1 });   // farther: flies over everything but the sun, costs distance - 1 fuel, may capture, never lands on a Core
    }
    if (p.fuel < MAXFUEL && nearStation(p)) push(STATION.x, STATION.y, 'refuel');   // drag the astronaut onto the sun: it stays where it is and takes fuel
    if (p.fuel < MAXFUEL) for (const v of pieces)                      // feed: take the fuel pack of an own rover/drone in the 8-neighbourhood (the astronaut stays put)
      if (v.owner === o && (v.type === 'rover' || v.type === 'drone') && v.fuel > 0 && !covered(v) && hexDist(v.x, v.y, p.x, p.y) === 1) push(v.x, v.y, 'feed');
  } else if (p.type === 'rover') {
    for (const [dx, dy] of HEX6) {
      for (let s = 1; s <= (ROVER_DOUBLE && p.fresh ? 2 : 1); s++) {   // one hex, but a rover that has not moved yet may take two (first move only)
        const x = p.x + dx * s, y = p.y + dy * s;
        if (!inB(x, y) || isStation(x, y)) break;
        const t = A(x, y);
        if (!t) { push(x, y, 'walk'); continue; }
        if (s > 1) { if (t.owner !== o && !fixed(t)) push(x, y, 'capture'); break; }   // the double step may capture an enemy on the second hex (the first hex had to be free), but cannot slip under a shield; a shield or a Core is never captured
        if (freeShield(t, o)) { push(x, y, 'walk'); break; }          // may move under its own shield, but not past it
        if (t.owner !== o && !fixed(t)) push(x, y, 'capture');
        break;
      }
    }
    if (p.fuel > 0) HEX6.forEach(([dx, dy]) => {     // the laser needs fuel. Turning and shooting is ONE move: the rover turns towards the target and fires
      const tr = beamTrace(p, dx, dy);
      if (tr.victim) push(tr.victim.x, tr.victim.y, 'laser', { dx, dy });
      else if (tr.shield && tr.shield.owner !== o) push(tr.shield.x, tr.shield.y, 'laser', { dx, dy });   // shooting at an enemy shield damages it
    });
  } else if (p.type === 'drone') {
    for (const [dx, dy] of HEX6) {
      for (let s = 1; s <= 3; s++) {
        const x = p.x + dx * s, y = p.y + dy * s;
        if (!inB(x, y) || isStation(x, y)) break;
        const t = A(x, y);
        if (!t) { push(x, y, 'walk'); continue; }
        if (freeShield(t, o)) { push(x, y, 'walk'); break; }          // may move under its own shield, but not past it
        if (t.owner !== o && !fixed(t)) {                     // glide up to the enemy, then push it
          const bx = x + dx, by = y + dy;
          const b = inB(bx, by) && A(bx, by);                          // piece behind the target, if any
          if (!inB(bx, by) || isStation(bx, by) || !b || (b.owner === o && !fixed(b)))   // blocked by the target's own side; the drone's own pieces crush it; into the central fire it burns up
            push(x, y, 'push', { dx, dy });
        }
        break;
      }
    }
  }
  return out;
}

const what = t => t.type === 'astro' ? 'an astronaut' : 'a ' + t.type;   // for log messages
function step(p, m) {                              // mutates pieces/turn/winner, returns log text
  let text = '';
  const A = (x, y) => at(x, y);
  if (m.kind === 'resign') {                        // the Core flies into the central fire: the game is over, the other side wins
    p.x = m.x; p.y = m.y; winner = 1 - p.owner;
    text = `${NAME[p.owner]} flies its Home Planet into the fire and resigns. ${NAME[winner]} wins!`;
  } else if (m.kind === 'refuel') {
    p.fuel++; text = `${NAME[p.owner]} ${p.type === 'astro' ? 'astronaut' : p.type} refuels (${p.fuel}/${fuelCap(p)}).`;
  } else if (m.kind === 'feed') {                   // the astronaut takes the vehicle's fuel pack; nobody moves
    const v = A(m.x, m.y); v.fuel--; p.fuel++;
    text = `${NAME[p.owner]} astronaut refuels from the ${v.type} (${p.fuel}/${MAXFUEL}).`;
  } else if (m.kind === 'aim') {                    // turning the laser is a whole move; the shot comes later
    p.dir = HEX6.findIndex(([a, b]) => a === m.dx && b === m.dy);
    text = `${NAME[p.owner]} rover turns its laser.`;
  } else if (m.kind === 'laser') {
    p.dir = HEX6.findIndex(([a, b]) => a === m.dx && b === m.dy);
    const tr = beamTrace(p, m.dx, m.dy), v = tr.victim;
    p.fuel = Math.max(0, p.fuel - 1);                // one unit of fuel per shot
    if (tr.shield) {                                 // a shield hit: it takes 1 damage (2 break it); it heals only after it has not been hit for one more move
      const sh = tr.shield; sh.dmg++; sh.hl = -1;
      if (sh.dmg >= 2) { pieces.splice(pieces.indexOf(sh), 1); text = `${NAME[p.owner]} rover shatters ${sh.owner === p.owner ? 'its own' : 'an enemy'} shield!`; }
      else text = `${NAME[p.owner]} rover cracks ${sh.owner === p.owner ? 'its own' : 'an enemy'} shield.`;
    }
    else if (v) {                                         // the target is destroyed (a rover too, own pieces included); the shooter stays intact
      pieces.splice(pieces.indexOf(v), 1);
      text = `${NAME[p.owner]} rover lasers ${v.owner === p.owner ? 'its own' : 'an enemy'} ${v.type === 'astro' ? 'astronaut' : v.type}!`;
    }
    else text = `${NAME[p.owner]} rover fires into empty space.`;
  } else if (m.kind === 'push') {
    const t = A(m.x, m.y), bx = m.x + m.dx, by = m.y + m.dy;
    p.x = m.x; p.y = m.y;                             // drone takes the pushed piece's square
    if (isStation(bx, by)) { pieces.splice(pieces.indexOf(t), 1); text = `${NAME[p.owner]} drone pushes ${what(t)} into the central fire!`; }
    else if (inB(bx, by) && !A(bx, by)) { t.x = bx; t.y = by; t.st = 1; text = `${NAME[p.owner]} drone pushes ${what(t)}.`; }
    else if (inB(bx, by)) { pieces.splice(pieces.indexOf(t), 1); text = `${NAME[p.owner]} drone crushes ${what(t)} against a ${NAME[p.owner]} piece!`; }
    else { pieces.splice(pieces.indexOf(t), 1); text = `${NAME[p.owner]} drone pushes ${what(t)} off the board!`; }
  } else if (p.type === 'shield') {                 // never captures: it just moves, and covers a piece that stands there
    const t = A(m.x, m.y);
    p.x = m.x; p.y = m.y;
    text = `${NAME[p.owner]} shield ${t ? 'covers ' + what(t) : 'moves'}.`;
  } else {
    const t = A(m.x, m.y), under = t && t.type === 'shield';          // moving onto an own shield: the piece just goes under it
    if (t && !under) {
      pieces.splice(pieces.indexOf(t), 1);
      text = `${NAME[p.owner]} captures ${what(t)}.`;
      if (p.type === 'astro' && t.type === 'astro' && t.fuel > 0) {
        p.fuel = Math.min(MAXFUEL, p.fuel + 1); text += ' Fuel stolen!';
      }
      if (t.type === 'core') winner = p.owner;
    }
    p.x = m.x; p.y = m.y; p.fresh = 0;                                // (a rover loses its double step with its first move)
    if (m.kind === 'jump') { p.fuel -= m.cost; if (!t) text = `${NAME[p.owner]} astronaut jets across.`; }
    if (under) text = `${NAME[p.owner]} ${p.type === 'astro' ? 'astronaut' : p.type} moves under its shield.`;
  }
  // Fuel fires: the piece that lands on one uses it up and is refuelled, only that piece: an astronaut gets +1 (never more than
  // MAXFUEL - 1, so a fire cannot overcharge it), a rover or drone is filled. A drone's glide onto a pushed enemy's hex counts as landing.
  if ((m.kind === 'walk' || m.kind === 'capture' || m.kind === 'jump' || m.kind === 'push') && (p.type === 'astro' || p.type === 'rover' || p.type === 'drone')) {
    const f = pieces.find(q => q.type === 'fire' && q.x === p.x && q.y === p.y);
    if (f) {
      pieces.splice(pieces.indexOf(f), 1);
      if (p.type === 'astro') p.fuel = Math.max(p.fuel, Math.min(MAXFUEL - 1, p.fuel + 1)); else p.fuel = fuelCap(p);
      text += ` The fuel fire flares up: the ${NAME[p.owner]} ${p.type === 'astro' ? 'astronaut' : p.type} is refuelled!`;
    }
  }
  // stun clears after the owner's next turn
  pieces.forEach(q => {
    if (q.owner !== turn) return;
    q.st = 0;
  });
  // Overcharge: an astronaut may hold the full fuel for one move only. After the move that fills it up it is `hot`; on its side's

// ---------- AI (plays Blue): iterative-deepening minimax with alpha-beta ----------
// who controls each colour: a 2x2 table of ticks (a tick in Human or in AI per colour); roleSel keeps the old four-value interface: 'red' (human Red), 'blue', 'none', 'two'
const ck = [['ck0h', 'ck0a'], ['ck1h', 'ck1a']].map(r => r.map(id => document.getElementById(id)));
const roleSel = {
  onchange: null,
  get value() { const b = ck[0][0].checked, r = ck[1][0].checked; return b && r ? 'two' : r ? 'red' : b ? 'blue' : 'none'; },
  set value(v) { const h = [v === 'two' || v === 'blue', v === 'two' || v === 'red']; ck.forEach((r, i) => { r[0].checked = h[i]; r[1].checked = !h[i]; }); },

ck.forEach((row, side) => row.forEach((c, k) => c.onchange = () => { c.checked = true; row[1 - k].checked = false; if (roleSel.onchange) roleSel.onchange(); }));   // exactly one tick per row

let aiOff = false;                                 // online: both sides are humans, whatever the table shows (it shows who is Host and who Guest)
const aiPlays = side => !aiOff && (roleSel.value === 'none' || (roleSel.value === 'red' && side === 0) || (roleSel.value === 'blue' && side === 1));
const aiTurn = () => started && winner === null && aiPlays(turn);   // 'No human': the AI moves for both sides
roleSel.onchange = () => { killPonder(); maybeAI(); startPonder(); };

// The searches run in a Web Worker built from the engine script, so the board stays responsive. While the human is
// thinking, the worker ponders: it prepares the AI's answer to every non-suicidal human reply (see ponderSearch).
const WORKER_GLUE = `
onmessage = e => { const d = e.data; pieces = d.pieces; turn = d.turn; winner = d.winner;
  if (d.task === 'ponder') ponderSearch(d.maxPlies, m => postMessage(m));
  else postMessage({ id: d.id, ...packResult(aiSearch(d.side, d.maxPlies, d.ms)) }); };`;

function startWorker() {
  if (worker) return worker;
  const src = 'let pieces, turn, winner;\n' + document.getElementById('engine').textContent + WORKER_GLUE;
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  worker.onmessage = e => {
    const d = e.data;
    if (d.type) {
      if (!pond) return;
      if (d.type === 'pstart') { pond.replies = d.replies; pond.pruned = d.pruned; }
      else if (d.type === 'pr') pond.table.set(d.sig, d);
      else if (d.type === 'pdepth') pond.depth = d.depth;

  return new Promise(resolve => {
    let w = null;
    try { w = startWorker(); } catch (e) { console.warn('no worker, searching on the main thread', e); }

  let w; try { w = startWorker(); } catch (e) { return; }

let infoBase = 'AI search: no move computed yet.';   // status window under the buttons
function renderInfo() {
  document.getElementById('aiinfo').textContent = infoBase + (pond
    ? `\nThinking along: ${pond.replies} possible replies (${pond.pruned} suicidal skipped), depth ${pond.depth}${pond.done ? ' (max)' : '...'}` : '');
}
function showAiInfo(side, r) {                     // how deep, from how many candidate moves

from ${r.moves} legal moves, ${r.nodes.toLocaleString()} positions, ${r.pondered ? 'prepared while you thought.' : (r.ms / 1000).toFixed(1) + ' s.'}`;

  // an answer prepared while the human was thinking is used at once if it is about as deep as a normal search would get
  const usable = hit && hit.depth >= Math.max(4, Math.min(2 * +aiDepth.value, lastAiDepth));
  (usable ? Promise.resolve({ ...hit, pondered: true }) : search(side)).then(r => {
    const go = () => {
      if (gen !== aiGen) return;

      const p = r.mv && at(r.mv.fx, r.mv.fy), m = p && legal(p).find(q => msig(p, q) === r.mv.sig);

    catch (e) { if (k + 1 >= tries) throw e; await new Promise(res => setTimeout(res, 700)); }

function resolveSig(sig) {                                        // find the piece and the move that a signature describes
  for (const p of pieces) if (p.owner === turn) for (const mv of legal(p)) if (msig(p, mv) === sig) return [p, mv];
  const m = /^(-?\d+),(-?\d+)>(laser|aim)(-?\d+),(-?\d+)$/.exec(sig);        // a laser aimed or fired at nothing is not in legal()
  const p = m && at(+m[1], +m[2]);
  return p && p.type === 'rover' && p.owner === turn ? [p, { kind: m[3], dx: +m[4], dy: +m[5], x: p.x, y: p.y }] : null;
}
function renderOnline() {
  if (!online) { onlineInfo.style.display = 'none'; return; }
  const me = online.color, other = 1 - me, link = location.origin + location.pathname + '?room=' + online.room;
  let html = me === 2 ? 'Online: you are watching this game.' : `Online game: you play <b style="color:${COLOR[me]}">${NAME[me]}</b>.`;
  if (!online.live) html += ' Loading the game…';
  else if (me < 2 && online.present[other]) html += ' Your friend is connected.';
  else if (me < 2 && online.hadFriend) html += ' Your friend is not connected right now (they can open the link again).';
  else if (me < 2) html += ` Waiting for your friend. Send this link:<input readonly value="${link}" onclick="this.select()"><button id="copylink">Copy link</button>`;
  onlineInfo.innerHTML = html; onlineInfo.style.display = 'block';
  const cb = document.getElementById('copylink');
  if (cb) cb.onclick = () => navigator.clipboard.writeText(link).then(() => say('Link copied.'), () => { cb.previousElementSibling.select(); });
}
function connectOnline() {
  const es = online.es = new EventSource('api/events?room=' + online.room + '&token=' + online.token);   // reconnects by itself and then only gets newer moves
  es.addEventListener('move', ev => {
    const d = JSON.parse(ev.data);
    if (d.i < online.applied) return;                             // our own move coming back
    if (d.i > online.applied) { location.reload(); return; }
    const r = resolveSig(d.sig);
    if (!r) { say('Out of sync with your friend: reloading…'); setTimeout(() => location.reload(), 900); return; }
    remoteMove = true; try { apply(r[0], r[1], ''); } finally { remoteMove = false; }
  });
  es.addEventListener('ready', () => { replaying = false; online.live = true; renderOnline(); draw(); if (online.wasDown) { online.wasDown = false; say('Connected again.'); } });   // the old moves are through: moves are live from here
  es.addEventListener('presence', ev => { online.present = JSON.parse(ev.data).present; if (online.present[1 - online.color]) online.hadFriend = true; renderOnline(); });
  es.onerror = () => { if (online) { online.wasDown = true; say('Connection lost, trying again…'); } };
}
function leaveOnline() {
  if (online && online.es) online.es.close();
  online = null; replaying = false; remoteMove = false; aiOff = false;
  document.getElementById('thH').textContent = 'Human'; document.getElementById('thA').textContent = 'AI';
  roleSel.disabled = false; for (const el of Object.values(setupEls)) el.disabled = false; for (const id of ['undo', 'suggest']) document.getElementById(id).style.display = '';
  window.history.replaceState(null, '', location.pathname); renderOnline();
}
async function enterOnline(room, token, color, setup, start, host) {   // setup, start and host (the Host's colour) come from the server: the Host chose them
  leaveOnline(); setSetup(setup); setupEls.start.value = start ? '1' : '0';
  online = { room, token, color, applied: 0, present: [false, false], live: false, hadFriend: false, es: null };
  window.history.replaceState(null, '', '?room=' + room + '#k=' + token);      // reload-safe; the secret stays in the hash and is never sent
  roleSel.value = host === 1 ? 'red' : 'blue'; roleSel.disabled = true; aiOff = true; started = true;   // the table now shows the Host's colour in the first column, the Guest's in the second
  document.getElementById('thH').textContent = 'Host'; document.getElementById('thA').textContent = 'Guest';
  for (const el of Object.values(setupEls)) el.disabled = true;
  for (const id of ['undo', 'suggest']) document.getElementById(id).style.display = 'none';
  replaying = true; newGame(); renderOnline(); connectOnline();
}
document.getElementById('online').onclick = async () => {
  if (online && !confirm('Leave this online game and open a new one?')) return;
  try { const h = roleSel.value, r = await api('new', { setup: setupCode(), start: +startSel.value, color: h === 'blue' ? 0 : h === 'red' ? 1 : null }); await enterOnline(r.room, r.token, r.color, r.setup, r.start, r.host); } catch (e) { say('Could not start an online game: ' + e.message); }
};

newGame(); draw();
{ const room = new URLSearchParams(location.search).get('room'), key = (location.hash.match(/k=([\w-]+)/) || [])[1];   // opened an invitation link
  if (room) api('join', { room, token: key }).then(r => enterOnline(room, r.token, r.color, r.setup, r.start, r.host)).catch(e => say(e.status === 404 ? 'This online game does not exist (any more).' : 'Could not join: ' + e.message)); }
if (typeof window !== 'undefined') setInterval(() => { if (!looping && pieces) draw(); }, 50);
</script>
